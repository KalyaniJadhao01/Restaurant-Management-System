<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RestaurantMS | Orders</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet"
          href="css/orders.css">

</head>

<body>

<div class="container">

    <!-- ================= Sidebar ================= -->

    <aside class="sidebar">

        <div>

            <div class="logo">

                <i class="fa-solid fa-utensils"></i>

                <span>RestaurantMS</span>

            </div>

            <ul>

                <li>
                    <a href="dashboard.html">
                        <i class="fa-solid fa-chart-line"></i>
                        Dashboard
                    </a>
                </li>

                <li>
                    <a href="menu.html">
                        <i class="fa-solid fa-bowl-food"></i>
                        Menu
                    </a>
                </li>

                <li>
                    <a href="categories.html">
                        <i class="fa-solid fa-layer-group"></i>
                        Categories
                    </a>
                </li>

                <li>
                    <a href="customers.html">
                        <i class="fa-solid fa-users"></i>
                        Customers
                    </a>
                </li>

                <li>
                    <a href="tables.html">
                        <i class="fa-solid fa-chair"></i>
                        Tables
                    </a>
                </li>

                <li class="active">
                    <a href="orders.html">
                        <i class="fa-solid fa-cart-shopping"></i>
                        Orders
                    </a>
                </li>

                <li>
                    <a href="reports.html">
                        <i class="fa-solid fa-chart-pie"></i>
                        Reports
                    </a>
                </li>

                <li>
                    <a href="settings.html">
                        <i class="fa-solid fa-gear"></i>
                        Settings
                    </a>
                </li>

            </ul>

        </div>

        <button class="logout-btn"
                onclick="logout()">

            <i class="fa-solid fa-right-from-bracket"></i>

            Logout

        </button>

    </aside>

    <!-- ================= Main ================= -->

    <main class="main-content">

        <header class="navbar">

            <div>

                <h2>Order Management</h2>

                <p>Create and manage restaurant orders</p>

            </div>

            <div class="profile">

                <i class="fa-solid fa-user-circle"></i>

                <span>Admin</span>

            </div>

        </header>

        <!-- Toolbar -->

        <section class="toolbar">

            <div class="search-box">

                <i class="fa-solid fa-search"></i>

                <input
                        id="searchInput"
                        type="text"
                        placeholder="Search orders...">

            </div>

            <button class="add-btn"
                    onclick="openModal()">

                <i class="fa-solid fa-plus"></i>

                New Order

            </button>

        </section>

        <!-- Orders Table -->

        <section class="table-card">

            <table>

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Customer</th>

                    <th>Table</th>

                    <th>Total</th>

                    <th>Status</th>

                    <th>Created</th>

                    <th>Actions</th>

                </tr>

                </thead>

                <tbody id="ordersTableBody">

                </tbody>

            </table>

        </section>

    </main>

</div>

<!-- ================= Modal ================= -->

<div class="modal"
     id="orderModal">

    <div class="modal-box large-modal">

        <h2 id="modalTitle">

            Create Order

        </h2>

        <div class="form-row">

            <div class="form-group">

                <label for="customerSelect">

                    Customer

                </label>

                <select id="customerSelect"
                        title="Customer">

                </select>

            </div>

            <div class="form-group">

                <label for="tableSelect">

                    Table

                </label>

                <select id="tableSelect"
                        title="Table">

                </select>

            </div>

        </div>

        <hr>

        <h3>

            Order Items

        </h3>

        <div class="item-row">

            <div class="form-group">

                <label for="menuItemSelect">

                    Menu Item

                </label>

                <select id="menuItemSelect"
                        title="Menu Item">

                </select>

            </div>

            <div class="form-group small-input">

                <label for="quantity">

                    Qty

                </label>

                <input
                        id="quantity"
                        type="number"
                        min="1"
                        value="1">

            </div>

            <button
               class="add-item-btn"
               type="button"
               title="Add Item"
               aria-label="Add Item"
               onclick="addItem()">

               <i class="fa-solid fa-plus"></i>

            </button>

        </div>

        <!-- Selected Items -->

        <table class="items-table">

            <thead>

            <tr>

                <th>Item</th>

                <th>Qty</th>

                <th>Price</th>

                <th>Subtotal</th>

                <th></th>

            </tr>

            </thead>

            <tbody id="selectedItemsBody">

            </tbody>

                    </table>

        <!-- Total Section -->

        <div class="total-card">

            <h3>

                Total Amount

            </h3>

            <h2 id="grandTotal">

                ₹ 0.00

            </h2>

        </div>

        <div class="form-group">

            <label for="orderStatus">

                Order Status

            </label>

            <select
                    id="orderStatus"
                    title="Order Status">

                <option value="PENDING">

                    Pending

                </option>

                <option value="PREPARING">

                    Preparing

                </option>

                <option value="SERVED">

                    Served

                </option>

                <option value="COMPLETED">

                    Completed

                </option>

                <option value="CANCELLED">

                    Cancelled

                </option>

            </select>

        </div>

        <div class="modal-actions">

            <button
                    class="save-btn"
                    onclick="saveOrder()">

                <i class="fa-solid fa-floppy-disk"></i>

                Save Order

            </button>

            <button
                    class="cancel-btn"
                    onclick="closeModal()">

                <i class="fa-solid fa-xmark"></i>

                Cancel

            </button>

        </div>

    </div>

</div>

<!-- Axios -->

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<!-- Orders JS -->

<script src="js/orders.js"></script>

</body>

</html>
