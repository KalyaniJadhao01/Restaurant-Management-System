<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet"
href="css/bills.css">

</head>

<body>

<div class="container">

<!-- ================= Sidebar ================= -->

<aside class="sidebar">

<div>

<div class="logo">

<i class="fa-solid fa-utensils"></i>

<span>RestaurantMS</span>

</div>

<ul>

<li>
<a href="dashboard.html">
<i class="fa-solid fa-chart-line"></i>
Dashboard
</a>
</li>

<li>
<a href="menu.html">
<i class="fa-solid fa-bowl-food"></i>
Menu
</a>
</li>

<li>
<a href="categories.html">
<i class="fa-solid fa-layer-group"></i>
Categories
</a>
</li>

<li>
<a href="customers.html">
<i class="fa-solid fa-users"></i>
Customers
</a>
</li>

<li>
<a href="tables.html">
<i class="fa-solid fa-chair"></i>
Tables
</a>
</li>

<li>
<a href="orders.html">
<i class="fa-solid fa-cart-shopping"></i>
Orders
</a>
</li>

<li class="active">
<a href="bills.html">
<i class="fa-solid fa-file-invoice-dollar"></i>
Bills
</a>
</li>

<li>
<a href="payments.html">
<i class="fa-solid fa-credit-card"></i>
Payments
</a>
</li>

<li>
<a href="reports.html">
<i class="fa-solid fa-chart-pie"></i>
Reports
</a>
</li>

<li>
<a href="settings.html">
<i class="fa-solid fa-gear"></i>
Settings
</a>
</li>

</ul>

</div>

<button
class="logout-btn"
onclick="logout()">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</button>

</aside>

<!-- ================= MAIN ================= -->

<main class="main-content">

<header class="navbar">

<div>

<h2>

Bill Management

</h2>

<p>

Generate and manage restaurant bills

</p>

</div>

<div class="profile">

<i class="fa-solid fa-user-circle"></i>

<span>

Admin

</span>

</div>

</header>

<!-- Toolbar -->

<section class="toolbar">

<div class="search-box">

<i class="fa-solid fa-search"></i>

<input
id="searchInput"
type="text"
placeholder="Search bills...">

</div>

<button
class="add-btn"
onclick="openModal()">

<i class="fa-solid fa-plus"></i>

Generate Bill

</button>

</section>

<!-- Bills Table -->

<section class="table-card">

<table>

<thead>

<tr>

<th>ID</th>

<th>Order</th>

<th>Subtotal</th>

<th>Tax</th>

<th>Discount</th>

<th>Total</th>

<th>Status</th>

<th>Date</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="billTableBody">

</tbody>

</table>

</section>

</main>

</div>

<!-- ================= MODAL ================= -->

<div
class="modal"
id="billModal">

<div class="modal-box">

<h2 id="modalTitle">

Generate Bill

</h2>

<div class="form-group">

<label for="orderId">

Order ID

</label>

<input
id="orderId"
type="number"
placeholder="Enter Order ID">

</div>

<div class="form-group">

<label for="discount">

Discount Amount

</label>

<input
id="discount"
type="number"
value="0"
step="0.01">

</div>

        <div class="form-group">

            <label for="billStatus">

                Bill Status

            </label>

            <select
                    id="billStatus"
                    title="Bill Status">

                <option value="UNPAID">

                    Unpaid

                </option>

                <option value="PAID">

                    Paid

                </option>

                <option value="CANCELLED">

                    Cancelled

                </option>

            </select>

        </div>

        <div class="modal-actions">

            <button
                    class="save-btn"
                    onclick="generateBill()">

                <i class="fa-solid fa-file-invoice-dollar"></i>

                Generate Bill

            </button>

            <button
                    class="cancel-btn"
                    onclick="closeModal()">

                <i class="fa-solid fa-xmark"></i>

                Cancel

            </button>

        </div>

    </div>

</div>

<!-- Axios -->

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<!-- Bills JS -->
<script src="js/config.js"></script>
<script src="js/bills.js"></script>

</body>

</html>
